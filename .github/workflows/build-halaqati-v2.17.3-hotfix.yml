name: Build Halaqati v2.17.3 Hotfix + Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0"

      - name: Verify v2.17.3 web and v2.17.2 base package
        shell: bash
        run: |
          set -euo pipefail
          test -s Halaqati-v2.17.3-web.zip || {
            echo "::error::Halaqati-v2.17.3-web.zip غير موجود في جذر المستودع"
            ls -la
            exit 1
          }
          test -s Halaqati-v2.17.2-publish-update.zip || {
            echo "::error::احتفظ مؤقتاً بملف Halaqati-v2.17.2-publish-update.zip لأنه قاعدة APK للتحديث"
            ls -la
            exit 1
          }

          rm -rf base_update web_extract
          mkdir -p base_update web_extract

          unzip -q Halaqati-v2.17.2-publish-update.zip -d base_update
          unzip -q Halaqati-v2.17.3-web.zip -d web_extract

          BASE_APK="$(find base_update -type f -name 'Halaqati-latest.apk' -not -path '*/__MACOSX/*' | head -n 1)"
          INDEX="$(find web_extract -type f -name 'index.html' -not -path '*/__MACOSX/*' | head -n 1)"

          test -n "${BASE_APK:-}" && test -s "$BASE_APK" || {
            echo "::error::لم أجد Halaqati-latest.apk داخل v2.17.2 publish-update"
            exit 1
          }
          test -n "${INDEX:-}" && test -s "$INDEX" || {
            echo "::error::لم أجد index.html داخل v2.17.3 web ZIP"
            exit 1
          }

          WEB_ROOT="$(dirname "$INDEX")"
          echo "BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "WEB_ROOT=$WEB_ROOT" >> "$GITHUB_ENV"

          grep -q "2.17.3" "$INDEX" || {
            echo "::error::ملف الويب لا يبدو v2.17.3"
            exit 1
          }

      - name: Download verified Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          EXPECTED="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"

          curl -fL --retry 3 --retry-delay 2 "$URL" -o apktool.jar
          echo "$EXPECTED  apktool.jar" | sha256sum -c -
          java -jar apktool.jar --version

      - name: Decode existing official APK without touching native DEX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf decoded
          java -jar apktool.jar d -f -s "$BASE_APK" -o decoded

          test -d decoded/assets/public || {
            echo "::error::assets/public غير موجود داخل APK الحالي"
            find decoded/assets -maxdepth 3 -type d -print 2>/dev/null || true
            exit 1
          }
          test -s decoded/apktool.yml

      - name: Replace embedded web with v2.17.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf decoded/assets/public
          mkdir -p decoded/assets/public
          cp -a "$WEB_ROOT"/. decoded/assets/public/

          # The downloadable APK must come from the remote update package, not be nested in itself.
          rm -f decoded/assets/public/Halaqati-latest.apk

          test -s decoded/assets/public/index.html
          test -s decoded/assets/public/sw.js
          test -d decoded/assets/public/assets
          grep -q "2.17.3" decoded/assets/public/index.html

      - name: Set Android version 2.17.3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("decoded/apktool.yml")
          s = p.read_text(encoding="utf-8")
          s2 = re.sub(r'(?m)^(\s*versionCode:\s*).+$', r'\g<1>21703', s)
          s2 = re.sub(r'(?m)^(\s*versionName:\s*).+$', r'\g<1>2.17.3', s2)
          if s2 == s:
              raise SystemExit("apktool.yml versionInfo was not updated")
          p.write_text(s2, encoding="utf-8")

          manifest = Path("decoded/AndroidManifest.xml")
          if manifest.exists():
              m = manifest.read_text(encoding="utf-8")
              m = re.sub(r'android:versionCode="[^"]+"', 'android:versionCode="21703"', m)
              m = re.sub(r'android:versionName="[^"]+"', 'android:versionName="2.17.3"', m)
              manifest.write_text(m, encoding="utf-8")
          PY

          grep -A4 -B2 -E 'versionCode|versionName' decoded/apktool.yml

      - name: Rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          rm -f Halaqati-v2.17.3-unsigned.apk
          java -jar apktool.jar b decoded -o Halaqati-v2.17.3-unsigned.apk
          test -s Halaqati-v2.17.3-unsigned.apk

      - name: Restore official signing key from GitHub Secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}" || { echo "::error::HALAQATI_KEYSTORE_BASE64 مفقود"; exit 1; }
          test -n "${STORE_PASSWORD:-}" || { echo "::error::HALAQATI_STORE_PASSWORD مفقود"; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo "::error::HALAQATI_KEY_ALIAS مفقود"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "::error::HALAQATI_KEY_PASSWORD مفقود"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > halaqati-release.jks
          test -s halaqati-release.jks

      - name: Align, sign, and verify same certificate
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            Halaqati-v2.17.3-unsigned.apk \
            Halaqati-v2.17.3-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks halaqati-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out Halaqati-v2.17.3.apk \
            Halaqati-v2.17.3-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Halaqati-v2.17.3.apk

          BASE_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$BASE_APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          NEW_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs Halaqati-v2.17.3.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"

          echo "Base certificate: $BASE_CERT"
          echo "New certificate : $NEW_CERT"
          test -n "$BASE_CERT"
          test "$BASE_CERT" = "$NEW_CERT" || {
            echo "::error::توقيع APK الجديد لا يطابق توقيع النسخة الحالية"
            exit 1
          }

      - name: Validate package, version, and embedded v2.17.3 features
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          "$BUILD_TOOLS/aapt" dump badging Halaqati-v2.17.3.apk | head -n 5 | tee badging.txt
          grep -q "package: name='com.mohammedsamir.halaqati'" badging.txt
          grep -q "versionCode='21703'" badging.txt
          grep -q "versionName='2.17.3'" badging.txt

          unzip -l Halaqati-v2.17.3.apk | grep -q 'assets/public/index.html'
          unzip -l Halaqati-v2.17.3.apk | grep -q 'assets/public/assets/runtime-B0-VaPeX.js'
          unzip -l Halaqati-v2.17.3.apk | grep -q 'assets/public/assets/app-D-XWWbw8.js'

          unzip -p Halaqati-v2.17.3.apk assets/public/index.html | grep -q "2.17.3"
          unzip -p Halaqati-v2.17.3.apk assets/public/assets/runtime-B0-VaPeX.js | grep -q "uploadSession"
          unzip -p Halaqati-v2.17.3.apk assets/public/assets/runtime-B0-VaPeX.js | grep -q "reopenSession"
          unzip -p Halaqati-v2.17.3.apk assets/public/assets/app-D-XWWbw8.js | grep -q "normalizeQuranNumberInput"

          echo "APK v2.17.3 package + signature + embedded web verified ✅"

      - name: Create v2.17.3 publish-update ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf update-publish
          mkdir -p update-publish

          cp Halaqati-v2.17.3.apk update-publish/Halaqati-latest.apk

          cat > update-publish/version.json <<'JSON'
          {
            "version": "2.17.3",
            "versionName": "2.17.3",
            "versionCode": 21703,
            "apkUrl": "https://syounis212004-sys.github.io/halaqati-web/Halaqati-latest.apk",
            "mandatory": false,
            "notes": [
              "إصلاح الإحصائيات الشهرية ومشكلة بداية الشهر بالتوقيت المحلي.",
              "إضافة اختيار الشهر في الصفحة الرئيسية.",
              "إضافة رفع الجلسة وإعادة فتحها وتعديل بياناتها والحذف النهائي بعد التأكيد.",
              "تحويل أرقام الآيات العربية والفارسية تلقائياً إلى أرقام إنجليزية قابلة للتعديل."
            ]
          }
          JSON

          (cd update-publish && zip -q -9 -r ../Halaqati-v2.17.3-publish-update.zip version.json Halaqati-latest.apk)

          test -s Halaqati-v2.17.3-publish-update.zip
          unzip -t Halaqati-v2.17.3-publish-update.zip
          cat update-publish/version.json

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v2.17.3-signed-apk
          path: Halaqati-v2.17.3.apk
          if-no-files-found: error

      - name: Upload publish-update ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v2.17.3-publish-update
          path: Halaqati-v2.17.3-publish-update.zip
          if-no-files-found: error
