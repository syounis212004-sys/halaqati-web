name: Deploy Latest Halaqati Automatically

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Halaqati-v*-publish-update.zip"
      - "Halaqati-v*-web.zip"
      - ".github/workflows/deploy-latest-auto.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: halaqati-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect newest versions automatically
        id: latest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          semver = re.compile(r"(\d+)\.(\d+)\.(\d+)")

          def version_key(name):
              m = semver.search(name)
              if not m:
                  return (-1, -1, -1)
              return tuple(map(int, m.groups()))

          root = Path(".")

          update_files = [
              p for p in root.iterdir()
              if p.is_file()
              and p.name.startswith("Halaqati-v")
              and p.name.endswith("-publish-update.zip")
          ]

          web_files = [
              p for p in root.iterdir()
              if p.is_file()
              and p.name.startswith("Halaqati-v")
              and p.name.endswith("-web.zip")
          ]

          if not update_files:
              raise SystemExit("ERROR: No publish-update ZIP found.")

          if not web_files:
              raise SystemExit("ERROR: No web ZIP found.")

          latest_update = max(update_files, key=lambda p: version_key(p.name))
          latest_web = max(web_files, key=lambda p: version_key(p.name))

          update_ver = ".".join(map(str, version_key(latest_update.name)))
          web_ver = ".".join(map(str, version_key(latest_web.name)))

          print(f"Latest updater: {latest_update.name}")
          print(f"Latest web:     {latest_web.name}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"update_zip={latest_update.name}\n")
              f.write(f"update_version={update_ver}\n")
              f.write(f"web_zip={latest_web.name}\n")
              f.write(f"web_version={web_ver}\n")
          PY

      - name: Prepare GitHub Pages site
        shell: bash
        env:
          UPDATE_ZIP: ${{ steps.latest.outputs.update_zip }}
          UPDATE_VERSION: ${{ steps.latest.outputs.update_version }}
          WEB_ZIP: ${{ steps.latest.outputs.web_zip }}
          WEB_VERSION: ${{ steps.latest.outputs.web_version }}
        run: |
          set -euo pipefail

          echo "Using updater: $UPDATE_ZIP"
          echo "Using web:     $WEB_ZIP"

          rm -rf _update _web _site
          mkdir -p _update _web _site

          unzip -q "$UPDATE_ZIP" -d _update
          unzip -q "$WEB_ZIP" -d _web

          INDEX_FILE="$(find _web -type f -name 'index.html' -not -path '*/__MACOSX/*' | head -n 1)"
          VERSION_FILE="$(find _update -type f -name 'version.json' -not -path '*/__MACOSX/*' | head -n 1)"
          APK_FILE="$(find _update -type f -name 'Halaqati-latest.apk' -not -path '*/__MACOSX/*' | head -n 1)"

          if [ -z "${INDEX_FILE:-}" ] || [ ! -s "$INDEX_FILE" ]; then
            echo "::error::index.html not found in $WEB_ZIP"
            exit 1
          fi

          if [ -z "${VERSION_FILE:-}" ] || [ ! -s "$VERSION_FILE" ]; then
            echo "::error::version.json not found in $UPDATE_ZIP"
            exit 1
          fi

          if [ -z "${APK_FILE:-}" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::Halaqati-latest.apk not found in $UPDATE_ZIP"
            exit 1
          fi

          WEB_ROOT="$(dirname "$INDEX_FILE")"
          cp -a "$WEB_ROOT"/. _site/
          cp "$VERSION_FILE" _site/version.json
          cp "$APK_FILE" _site/Halaqati-latest.apk
          touch _site/.nojekyll

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_version = os.environ["UPDATE_VERSION"]

          p = Path("_site/version.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          required = ["versionName", "versionCode", "apkUrl"]
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"ERROR: version.json missing: {missing}")

          actual_version = str(data["versionName"]).lstrip("v")

          if actual_version != expected_version:
              raise SystemExit(
                  f"ERROR: newest ZIP is v{expected_version}, "
                  f"but version.json inside it says v{actual_version}"
              )

          if not isinstance(data["versionCode"], int):
              raise SystemExit("ERROR: versionCode must be integer")

          if not str(data["apkUrl"]).endswith("/Halaqati-latest.apk"):
              raise SystemExit("ERROR: apkUrl must end with /Halaqati-latest.apk")

          apk = Path("_site/Halaqati-latest.apk")
          if not apk.exists() or apk.stat().st_size == 0:
              raise SystemExit("ERROR: APK missing or empty")

          print()
          print("=== AUTO SELECT RESULT ===")
          print("Published app version:", actual_version)
          print("Published versionCode:", data["versionCode"])
          print("APK URL:", data["apkUrl"])
          print("==========================")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
