name: Deploy Halaqati Web + APK Update to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      web_zip:
        description: "Optional web ZIP name from repository root. Leave blank to auto-pick the latest Halaqati-v*-web.zip"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - "version.json"
      - "Halaqati-latest.apk"
      - "Halaqati-v*-web.zip"
      - ".github/workflows/deploy-halaqati-pages-update.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: halaqati-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish web + updater
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail

          INPUT_WEB_ZIP="${{ github.event.inputs.web_zip || '' }}"

          if [ -n "$INPUT_WEB_ZIP" ]; then
            WEB_ZIP="$INPUT_WEB_ZIP"
          else
            WEB_ZIP="$(
              find . -maxdepth 1 -type f -name 'Halaqati-v*-web.zip' -printf '%f\n' \
              | sort -V \
              | tail -n 1
            )"
          fi

          if [ -z "${WEB_ZIP:-}" ] || [ ! -f "$WEB_ZIP" ]; then
            echo "::error::No Halaqati-v*-web.zip found in repository root."
            ls -la
            exit 1
          fi

          if [ ! -s version.json ]; then
            echo "::error::version.json is missing or empty."
            exit 1
          fi

          if [ ! -s Halaqati-latest.apk ]; then
            echo "::error::Halaqati-latest.apk is missing or empty."
            exit 1
          fi

          echo "Using web package: $WEB_ZIP"

          rm -rf _web_extract _site
          mkdir -p _web_extract _site

          unzip -q "$WEB_ZIP" -d _web_extract

          INDEX_FILE="$(
            find _web_extract -type f -name 'index.html' \
            -not -path '*/__MACOSX/*' \
            -print \
            | head -n 1
          )"

          if [ -z "${INDEX_FILE:-}" ] || [ ! -f "$INDEX_FILE" ]; then
            echo "::error::index.html was not found inside $WEB_ZIP"
            find _web_extract -maxdepth 4 -type f -print | head -200
            exit 1
          fi

          WEB_ROOT="$(dirname "$INDEX_FILE")"
          cp -a "$WEB_ROOT"/. _site/

          # Always publish the newest updater files from repository root.
          cp version.json _site/version.json
          cp Halaqati-latest.apk _site/Halaqati-latest.apk

          # Avoid Jekyll filtering files/directories.
          touch _site/.nojekyll

          # Remove common archive junk.
          find _site -name '.DS_Store' -delete 2>/dev/null || true
          rm -rf _site/__MACOSX 2>/dev/null || true

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("_site/version.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          required = ["versionName", "versionCode", "apkUrl"]
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"Missing version.json keys: {missing}")

          if not isinstance(data["versionCode"], int):
              raise SystemExit("versionCode must be an integer")

          if not str(data["apkUrl"]).endswith("/Halaqati-latest.apk"):
              raise SystemExit("apkUrl must end with /Halaqati-latest.apk")

          apk = Path("_site/Halaqati-latest.apk")
          if not apk.is_file() or apk.stat().st_size == 0:
              raise SystemExit("Published APK is missing or empty")

          print("Publishing version:", data["versionName"], data["versionCode"])
          print("APK URL:", data["apkUrl"])
          print("APK bytes:", apk.stat().st_size)
          PY

          test -s _site/index.html
          test -s _site/version.json
          test -s _site/Halaqati-latest.apk

          echo "Prepared Pages site successfully."
          du -sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
