name: Deploy Halaqati Web v2.17.2 + Update Files to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Halaqati-v2.17.2-web.zip"
      - "Halaqati-v2.17.2-publish-update.zip"
      - ".github/workflows/deploy-halaqati-web-v2.17.2.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "halaqati-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare web site
        shell: bash
        run: |
          set -euo pipefail

          WEB_ZIP="Halaqati-v2.17.2-web.zip"
          UPDATE_ZIP="Halaqati-v2.17.2-publish-update.zip"

          if [ ! -f "$WEB_ZIP" ]; then
            WEB_ZIP="$(find . -maxdepth 1 -type f -iname '*v2.17.2*web*.zip' -print | head -n 1)"
          fi

          if [ ! -f "$UPDATE_ZIP" ]; then
            UPDATE_ZIP="$(find . -maxdepth 1 -type f -iname '*v2.17.2*publish*update*.zip' -print | head -n 1)"
          fi

          test -n "${WEB_ZIP:-}" && test -f "$WEB_ZIP" || {
            echo "ERROR: Halaqati v2.17.2 web ZIP was not found in repository root."
            ls -la
            exit 1
          }

          test -n "${UPDATE_ZIP:-}" && test -f "$UPDATE_ZIP" || {
            echo "ERROR: Halaqati v2.17.2 publish-update ZIP was not found in repository root."
            ls -la
            exit 1
          }

          rm -rf web_extract update_extract _site
          mkdir -p web_extract update_extract _site

          unzip -q "$WEB_ZIP" -d web_extract

          INDEX_FILE="$(find web_extract -type f -name 'index.html' -print | head -n 1)"
          test -n "$INDEX_FILE" && test -f "$INDEX_FILE" || {
            echo "ERROR: index.html was not found inside $WEB_ZIP"
            find web_extract -maxdepth 3 -type f -print
            exit 1
          }

          WEB_ROOT="$(dirname "$INDEX_FILE")"
          cp -a "$WEB_ROOT"/. _site/

          unzip -q "$UPDATE_ZIP" -d update_extract

          VERSION_FILE="$(find update_extract -type f -name 'version.json' -print | head -n 1)"
          APK_FILE="$(find update_extract -type f -name 'Halaqati-latest.apk' -print | head -n 1)"

          test -n "$VERSION_FILE" && test -f "$VERSION_FILE" || {
            echo "ERROR: version.json was not found inside $UPDATE_ZIP"
            find update_extract -maxdepth 3 -type f -print
            exit 1
          }

          test -n "$APK_FILE" && test -f "$APK_FILE" || {
            echo "ERROR: Halaqati-latest.apk was not found inside $UPDATE_ZIP"
            find update_extract -maxdepth 3 -type f -print
            exit 1
          }

          cp "$VERSION_FILE" _site/version.json
          cp "$APK_FILE" _site/Halaqati-latest.apk

          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/version.json
          test -f _site/Halaqati-latest.apk
          test -f _site/sw.js
          test -d _site/assets
          test -d _site/core
          test -d _site/vendor

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("_site/version.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print("Update manifest:", json.dumps(data, ensure_ascii=False, indent=2))

          version = str(data.get("version", ""))
          if version and version != "2.17.2":
              raise SystemExit(f"ERROR: expected version 2.17.2 in version.json, got {version}")
          PY

          echo "Prepared GitHub Pages site:"
          du -sh _site
          find _site -maxdepth 2 -type f | sort | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
