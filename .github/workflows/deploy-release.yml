name: Deploy Halaqati Web + APK Update ZIPs

on:
  workflow_dispatch:
    inputs:
      web_zip:
        description: "اسم Web ZIP (اتركه فارغاً لاختيار أحدث Halaqati-v*-web.zip)"
        required: false
        default: ""
      update_zip:
        description: "اسم Update ZIP (اتركه فارغاً لاختيار أحدث Halaqati-v*-publish-update.zip)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy web and APK updater
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Choose release ZIPs
        id: choose
        shell: bash
        run: |
          set -euo pipefail
          WEB_INPUT="${{ github.event.inputs.web_zip || '' }}"
          UPDATE_INPUT="${{ github.event.inputs.update_zip || '' }}"

          if [ -n "$WEB_INPUT" ]; then
            WEB_ZIP="$WEB_INPUT"
          else
            WEB_ZIP="$(find . -maxdepth 1 -type f -name 'Halaqati-v*-web.zip' -printf '%f\n' | sort -V | tail -n 1)"
          fi

          if [ -n "$UPDATE_INPUT" ]; then
            UPDATE_ZIP="$UPDATE_INPUT"
          else
            UPDATE_ZIP="$(find . -maxdepth 1 -type f -name 'Halaqati-v*-publish-update.zip' -printf '%f\n' | sort -V | tail -n 1)"
          fi

          test -n "${WEB_ZIP:-}" && test -f "$WEB_ZIP" || { echo "::error::لم أجد Web ZIP في جذر المستودع"; ls -la; exit 1; }
          test -n "${UPDATE_ZIP:-}" && test -f "$UPDATE_ZIP" || { echo "::error::لم أجد publish-update ZIP في جذر المستودع"; ls -la; exit 1; }

          echo "Web ZIP: $WEB_ZIP"
          echo "Update ZIP: $UPDATE_ZIP"
          echo "web_zip=$WEB_ZIP" >> "$GITHUB_OUTPUT"
          echo "update_zip=$UPDATE_ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _web_extract _update_extract _site
          mkdir -p _web_extract _update_extract _site
          unzip -q "${{ steps.choose.outputs.web_zip }}" -d _web_extract
          INDEX="$(find _web_extract -type f -name 'index.html' -not -path '*/__MACOSX/*' | head -n 1)"
          test -n "${INDEX:-}" || { echo "::error::لم أجد index.html داخل Web ZIP"; exit 1; }
          ROOT="$(dirname "$INDEX")"
          cp -a "$ROOT"/. _site/
          find _site -name '.DS_Store' -delete 2>/dev/null || true
          rm -rf _site/__MACOSX 2>/dev/null || true

      - name: Extract APK update package
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "${{ steps.choose.outputs.update_zip }}" -d _update_extract
          VERSION="$(find _update_extract -type f -name 'version.json' -not -path '*/__MACOSX/*' | head -n 1)"
          APK="$(find _update_extract -type f -name 'Halaqati-latest.apk' -not -path '*/__MACOSX/*' | head -n 1)"
          test -n "${VERSION:-}" && test -s "$VERSION" || { echo "::error::version.json غير موجود"; exit 1; }
          test -n "${APK:-}" && test -s "$APK" || { echo "::error::Halaqati-latest.apk غير موجود"; exit 1; }
          cp "$VERSION" _site/version.json
          cp "$APK" _site/Halaqati-latest.apk

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/version.json
          test -s _site/Halaqati-latest.apk
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('_site/version.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('versionName'), 'versionName missing'
          assert isinstance(d.get('versionCode'), int), 'versionCode missing/invalid'
          assert d.get('apkUrl','').endswith('/Halaqati-latest.apk'), 'apkUrl invalid'
          print('Release version:', d['versionName'], d['versionCode'])
          print('APK bytes:', pathlib.Path('_site/Halaqati-latest.apk').stat().st_size)
          PY
          echo "Web + updater package validated ✅"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  
