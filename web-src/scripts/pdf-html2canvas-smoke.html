<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Halaqati PDF smoke</title>
<style>
html,body{margin:0;background:#eee;font-family:Arial,sans-serif}.paper{width:1120px;background:#fff;color:#18231f}.pro-report-page{width:1120px;background:#fff;padding:24px;box-sizing:border-box}.pro-head{height:90px;border-bottom:2px solid #c89d4a}.pro-meta{height:50px}.pro-table{width:100%;border-collapse:collapse;table-layout:fixed}.pro-table th{background:#0d3b2f;color:#fff}.pro-table th,.pro-table td{border:1px solid #dfe6e2;padding:9px;text-align:center;font-size:15px}.pro-table .name{font-weight:bold;width:22%}.pro-footer{height:42px;border-top:1px solid #ddd;margin-top:12px}.hf-pdf-continuation-label{padding:8px;border:1px solid #ddd}.hf-pdf-render-stage{position:fixed!important;left:0!important;top:0!important;background:#fff!important;visibility:visible!important;opacity:1!important;pointer-events:none!important;z-index:100!important;transform:none!important;overflow:visible!important}
</style>
<script src="./vendor/html2canvas-1.4.1.min.js"></script></head><body>
<div id="paper" class="paper"><div id="host"><section id="source" class="pro-report-page"><div class="pro-head"><h1>حلقتي - اختبار PDF</h1></div><div class="pro-meta">الفترة: اختبار</div><div class="pro-table-wrap"><table class="pro-table"><thead><tr><th>#</th><th>الطالب</th><th>الفئة</th><th>النقاط</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pro-footer">حلقتي</div></section></div></div>
<pre id="result">RUNNING</pre>
<script>
for(let i=1;i<=22;i++){const tr=document.createElement('tr');tr.innerHTML=`<td>${i}</td><td class="name">طالب رقم ${i} الاسم الكامل للاختبار</td><td>بدون فئة</td><td>${i*2}</td>`;rows.appendChild(tr)}
function normalizePdfClone(clone,sourcePage){clone.style.margin='0';clone.style.width=sourcePage.scrollWidth+'px';clone.style.maxWidth='none';clone.style.height='auto';clone.style.minHeight='0';clone.style.overflow='visible';clone.style.visibility='visible';clone.style.opacity='1';clone.style.display='block';clone.style.transform='none';return clone}
function buildRowSafePdfPages(sourcePage,maxPageHeight){const tables=[...sourcePage.querySelectorAll('.pro-table')],table=tables.length===1?tables[0]:null,tbody=table?.tBodies?.[0];if(!table||!tbody||!tbody.rows.length||sourcePage.scrollHeight<=maxPageHeight+2)return{pages:[normalizePdfClone(sourcePage.cloneNode(true),sourcePage)],cleanup:()=>{},applied:false};const host=sourcePage.parentElement,sandbox=document.createElement('div');sandbox.style.cssText=`position:absolute;left:-100000px;top:0;width:${sourcePage.scrollWidth}px;visibility:hidden;pointer-events:none;z-index:-1;`;host.appendChild(sandbox);const rows=[...tbody.rows].map(r=>r.cloneNode(true)),result=[];let cursor=0,first=true;function makeShell(isFirst){const clone=normalizePdfClone(sourcePage.cloneNode(true),sourcePage),cloneTable=clone.querySelector('.pro-table'),body=cloneTable.tBodies[0];body.innerHTML='';if(!isFirst){const wrap=cloneTable.closest('.pro-table-wrap'),head=clone.querySelector('.pro-head'),meta=clone.querySelector('.pro-meta'),footer=clone.querySelector('.pro-footer');[...clone.children].forEach(ch=>{if(ch===head||ch===meta||ch===wrap||ch===footer)return;ch.remove()});const marker=document.createElement('div');marker.className='hf-pdf-continuation-label';marker.textContent='تابع التقرير';clone.insertBefore(marker,wrap)}sandbox.appendChild(clone);return{clone,body}}while(cursor<rows.length){const shell=makeShell(first);let added=0;while(cursor<rows.length){const row=rows[cursor].cloneNode(true);shell.body.appendChild(row);const tooTall=shell.clone.scrollHeight>maxPageHeight;if(tooTall&&added>0){row.remove();break}cursor++;added++;if(tooTall)break}result.push(shell.clone);first=false}return{pages:result,cleanup:()=>sandbox.remove(),applied:true}}
function canvasLooksBlank(canvas){if(!canvas||canvas.width<10||canvas.height<10)return true;const ctx=canvas.getContext('2d',{willReadFrequently:true});const step=Math.max(8,Math.floor(Math.min(canvas.width,canvas.height)/180));let ink=0,checked=0;const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;for(let y=0;y<canvas.height;y+=step){for(let x=0;x<canvas.width;x+=step){const i=(y*canvas.width+x)*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];checked++;if(a>20&&(r<242||g<242||b<242)){ink++;if(ink>=12)return false}}}return checked>0&&ink<12}
async function run(){try{await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const source=document.getElementById('source');const p=buildRowSafePdfPages(source,600);const counts=p.pages.map(x=>x.querySelectorAll('tbody tr').length);if(p.pages.length<2)throw Error('pagination did not split');if(counts.reduce((a,b)=>a+b,0)!==22)throw Error('row loss/duplication '+counts.join(','));if(p.pages.some(x=>!x.querySelector('thead')))throw Error('missing repeated table head');const stage=document.createElement('div');stage.className='hf-pdf-render-stage';stage.style.width=source.scrollWidth+'px';paper.appendChild(stage);let rendered=0;for(const pg of p.pages){stage.replaceChildren(pg);pg.style.visibility='visible';await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const cs=getComputedStyle(pg),rect=pg.getBoundingClientRect();if(cs.visibility!=='visible'||cs.display==='none'||rect.width<100||rect.height<100)throw Error('render page not visible');if(window.html2canvas){const c=await html2canvas(pg,{scale:1,backgroundColor:'#fff',logging:false,windowWidth:pg.scrollWidth,windowHeight:pg.scrollHeight});if(canvasLooksBlank(c))throw Error('html2canvas produced blank page');rendered++}}
p.cleanup();stage.remove();result.textContent=window.html2canvas?`PDF_SMOKE_PASS pages=${counts.join(',')} rendered=${rendered}`:`PDF_DOM_PASS_NO_CANVAS pages=${counts.join(',')}`;
}catch(e){result.textContent='PDF_SMOKE_FAIL '+e.message}}
run();
</script></body></html>
