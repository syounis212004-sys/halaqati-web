<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:Arial,sans-serif}.page{width:1120px;height:760px;background:#fff;color:#18231f;padding:20px;box-sizing:border-box}.head{font-size:28px;font-weight:800;border-bottom:3px solid #0d3b2f;padding:10px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.k{border:1px solid #ddd;padding:12px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}th{background:#0d3b2f;color:#fff;padding:8px}td{border:1px solid #ddd;padding:7px;text-align:center}.name{white-space:nowrap;font-weight:700}</style></head><body>
<div id="page" class="page"><div class="head">حلقتي — اختبار PDF 300 DPI الآمن للذاكرة</div><div class="grid"><div class="k">الحضور 95%</div><div class="k">الحفظ 18.5</div><div class="k">السرد 20</div><div class="k">الأخطاء 3</div><div class="k">النقاط 42</div><div class="k">الطلاب 48</div></div><table><thead><tr><th>#</th><th>الطالب</th><th>الفئة</th><th>المسار</th><th>الحفظ</th><th>السرد</th><th>النقاط</th><th>الحضور</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="result">RUNNING</div>
<script src="/vendor/html2canvas-1.4.1.min.js"></script><script src="/vendor/jspdf-2.5.1.umd.min.js"></script><script>
(async()=>{try{
const rows=document.getElementById('rows');for(let i=1;i<=18;i++)rows.insertAdjacentHTML('beforeend',`<tr><td>${i}</td><td class="name">أحمد محمد إسماعيل أبو عودة ${i}</td><td>فئة السنابل</td><td>الحفظ العام</td><td>${(i/3).toFixed(2)}</td><td>${i}</td><td>${i*2}</td><td>${90+i%10}%</td></tr>`);
const el=document.getElementById('page'),scale=300/96,budget=1500000,width=el.clientWidth,rasterW=Math.ceil(width*scale),tileRasterH=Math.max(96,Math.floor(budget/rasterW)),tileCssH=Math.max(48,Math.floor(tileRasterH/scale));
const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:false});const boxW=283,pageH=196,totalH=el.scrollHeight;let top=0,parts=0,maxArea=0;
while(top<totalH){const h=Math.min(tileCssH,totalH-top);const c=await html2canvas(el,{scale,backgroundColor:'#fff',logging:false,width,height:h,x:0,y:top,windowWidth:width,windowHeight:totalH,scrollX:0,scrollY:0});maxArea=Math.max(maxArea,c.width*c.height);const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));const bytes=new Uint8Array(await blob.arrayBuffer());const y=7+(top/totalH)*pageH,hh=(h/totalH)*pageH;pdf.addImage(bytes,'PNG',7,y,boxW,hh,`t${parts}`,'NONE');c.width=1;c.height=1;top+=h;parts++;await new Promise(r=>setTimeout(r,0));}
const out=pdf.output('arraybuffer');const pass=parts>=2&&maxArea<=budget+10000&&out.byteLength>2000;document.body.dataset.result=pass?'pass':'fail';document.getElementById('result').textContent=pass?`PDF_MEMORY_V2402_PASS parts=${parts} maxArea=${maxArea} bytes=${out.byteLength}`:`PDF_MEMORY_V2402_FAIL parts=${parts} maxArea=${maxArea} bytes=${out.byteLength}`;
}catch(e){document.body.dataset.result='fail';document.getElementById('result').textContent='PDF_MEMORY_V2402_FAIL '+e.message}})();
</script></body></html>
